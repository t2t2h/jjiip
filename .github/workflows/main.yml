name: Build AgoraEnhance

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid make

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install iOS SDKs
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p "$HOME/theos/sdks"
          cp -R /tmp/sdks/*.sdk "$HOME/theos/sdks/"

      - name: Build
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          make clean
          make FINALPACKAGE=1

      - name: Locate dylib
        run: find .theos -name "AgoraEnhance.dylib" -print

      - uses: actions/upload-artifact@v4
        with:
          name: AgoraEnhance-dylib
          path: .theos/obj/AgoraEnhance.dylib
          if-no-files-found: error
